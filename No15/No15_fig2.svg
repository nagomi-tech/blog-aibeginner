<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>事前学習からRLHFまでの3段階</title>
<desc>同じ言語モデルが、事前学習、指示チューニング、RLHFという3つの段階を経て、色の濃淡が濃くなるように仕上げられていく様子を示す図</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="235" y="70" font-size="12" fill="#5f5e5a" text-anchor="middle">学習</text>
<line x1="220" y1="145" x2="246" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="445" y="70" font-size="12" fill="#5f5e5a" text-anchor="middle">調整</text>
<line x1="430" y1="145" x2="456" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="90" width="180" height="110" rx="8" fill="#eef4fb" stroke="#7c98b8" stroke-width="0.5"/>
<text x="130" y="125" font-size="14" font-weight="500" fill="#1e3a5c" text-anchor="middle">事前学習</text>
<text x="130" y="155" font-size="12" fill="#1e3a5c" text-anchor="middle">次の単語を予測</text>

<rect x="250" y="90" width="180" height="110" rx="8" fill="#cfe0f2" stroke="#5b84ab" stroke-width="0.5"/>
<text x="340" y="125" font-size="14" font-weight="500" fill="#163152" text-anchor="middle">指示チューニング</text>
<text x="340" y="155" font-size="12" fill="#163152" text-anchor="middle">幅広い指示に対応</text>

<rect x="460" y="90" width="180" height="110" rx="8" fill="#a9c9e6" stroke="#3f6690" stroke-width="0.5"/>
<text x="550" y="125" font-size="14" font-weight="500" fill="#0c2338" text-anchor="middle">RLHF後</text>
<text x="550" y="155" font-size="12" fill="#0c2338" text-anchor="middle">人に好まれる応答</text>
</svg>
