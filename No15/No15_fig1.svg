<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Few-shot学習の例（GPT-3論文の英仏翻訳タスクに基づく）</title>
<desc>プロンプトに英語からフランス語への翻訳例をいくつか示すことで、言語モデルが新しい単語にも対応する様子を示す図</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="40" width="320" height="180" rx="8" fill="#eef4fb" stroke="#7c98b8" stroke-width="0.5"/>
<text x="60" y="68" font-size="14" font-weight="500" fill="#1e3a5c">プロンプト</text>
<text x="60" y="96" font-size="12" fill="#3d5875">Translate English to French:</text>
<text x="60" y="120" font-size="12" fill="#3d5875">sea otter =&gt; loutre de mer</text>
<text x="60" y="144" font-size="12" fill="#3d5875">peppermint =&gt; menthe poivree</text>
<text x="60" y="176" font-size="12" font-weight="500" fill="#1e3a5c">cheese =&gt; ?</text>

<line x1="360" y1="130" x2="386" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="390" y="100" width="120" height="60" rx="8" fill="#f0f0ee" stroke="#9c9a92" stroke-width="0.5"/>
<text x="450" y="122" font-size="14" font-weight="500" fill="#3d3d3a" text-anchor="middle">言語モデル</text>
<text x="450" y="142" font-size="12" fill="#5f5e5a" text-anchor="middle">Few-shot</text>

<line x1="510" y1="130" x2="526" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="530" y="100" width="100" height="60" rx="8" fill="#eaf3de" stroke="#7fa050" stroke-width="0.5"/>
<text x="580" y="122" font-size="14" font-weight="500" fill="#27500a" text-anchor="middle">出力</text>
<text x="580" y="142" font-size="12" fill="#3b6d11" text-anchor="middle">fromage</text>
</svg>
