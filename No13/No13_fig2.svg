<svg viewBox="0 0 700 560" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">
    Transformerの全体構造——Encoder と Decoder
  </text>

  <!-- Column headers -->
  <text x="180" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7fc9">Encoder</text>
  <text x="500" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97a4a">Decoder</text>

  <!-- ===== Encoder column ===== -->
  <!-- input -->
  <rect x="80" y="470" width="200" height="40" rx="6" fill="#f7f9fb" stroke="#9aa5b1"/>
  <text x="180" y="495" text-anchor="middle" font-size="13" fill="#1f2d3d">入力文</text>

  <line x1="180" y1="470" x2="180" y2="450" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- embedding + position -->
  <rect x="60" y="400" width="240" height="46" rx="6" fill="#eef4fb" stroke="#4a7fc9"/>
  <text x="180" y="420" text-anchor="middle" font-size="12" fill="#1f2d3d">単語埋め込み</text>
  <text x="180" y="437" text-anchor="middle" font-size="12" fill="#1f2d3d">＋ 位置エンコーディング</text>

  <line x1="180" y1="400" x2="180" y2="365" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Encoder block -->
  <rect x="50" y="220" width="260" height="140" rx="8" fill="#ffffff" stroke="#4a7fc9" stroke-width="2"/>
  <rect x="70" y="240" width="220" height="42" rx="6" fill="#eef4fb" stroke="#4a7fc9"/>
  <text x="180" y="266" text-anchor="middle" font-size="12" fill="#1f2d3d">Self-Attention（Multi-Head）</text>

  <line x1="180" y1="282" x2="180" y2="298" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrowsm)"/>

  <rect x="70" y="300" width="220" height="42" rx="6" fill="#eef4fb" stroke="#4a7fc9"/>
  <text x="180" y="326" text-anchor="middle" font-size="12" fill="#1f2d3d">Feed-Forward</text>

  <text x="325" y="295" font-size="13" font-weight="bold" fill="#4a7fc9">× N</text>

  <line x1="180" y1="220" x2="180" y2="190" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- encoder output -->
  <rect x="80" y="150" width="200" height="40" rx="6" fill="#dcebff" stroke="#4a7fc9" stroke-width="2"/>
  <text x="180" y="175" text-anchor="middle" font-size="12" fill="#1f2d3d">入力文の意味表現</text>

  <!-- ===== Decoder column ===== -->
  <!-- input -->
  <rect x="400" y="470" width="220" height="40" rx="6" fill="#f7f9fb" stroke="#9aa5b1"/>
  <text x="510" y="495" text-anchor="middle" font-size="12" fill="#1f2d3d">正解出力（1つ前まで）</text>

  <line x1="510" y1="470" x2="510" y2="450" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- embedding + position -->
  <rect x="390" y="400" width="240" height="46" rx="6" fill="#fdeee3" stroke="#d97a4a"/>
  <text x="510" y="420" text-anchor="middle" font-size="12" fill="#1f2d3d">単語埋め込み</text>
  <text x="510" y="437" text-anchor="middle" font-size="12" fill="#1f2d3d">＋ 位置エンコーディング</text>

  <line x1="510" y1="400" x2="510" y2="378" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decoder block -->
  <rect x="380" y="140" width="260" height="238" rx="8" fill="#ffffff" stroke="#d97a4a" stroke-width="2"/>

  <rect x="400" y="158" width="220" height="40" rx="6" fill="#fdeee3" stroke="#d97a4a"/>
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#1f2d3d">Self-Attention（マスク付き）</text>

  <line x1="510" y1="198" x2="510" y2="212" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrowsm)"/>

  <rect x="400" y="214" width="220" height="40" rx="6" fill="#fbe4e0" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="238" text-anchor="middle" font-size="11" fill="#1f2d3d">Cross-Attention</text>

  <line x1="510" y1="254" x2="510" y2="268" stroke="#9aa5b1" stroke-width="1.5" marker-end="url(#arrowsm)"/>

  <rect x="400" y="270" width="220" height="40" rx="6" fill="#fdeee3" stroke="#d97a4a"/>
  <text x="510" y="294" text-anchor="middle" font-size="12" fill="#1f2d3d">Feed-Forward</text>

  <text x="685" y="260" text-anchor="end" font-size="13" font-weight="bold" fill="#d97a4a">× N</text>

  <line x1="510" y1="140" x2="510" y2="115" stroke="#9aa5b1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decoder output -->
  <rect x="410" y="72" width="200" height="40" rx="6" fill="#fbe4e0" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="97" text-anchor="middle" font-size="12" fill="#1f2d3d">次の単語の確率</text>

  <!-- Cross attention arrow from encoder output to decoder cross-attention -->
  <path d="M 280,170 C 350,170 350,234 400,234" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <text x="345" y="150" text-anchor="middle" font-size="11" fill="#c0392b">Encoderの意味表現を参照</text>

  <!-- arrow marker defs -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9aa5b1"/>
    </marker>
    <marker id="arrowsm" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aa5b1"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
</svg>