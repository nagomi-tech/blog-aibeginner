<svg viewBox="0 0 680 420" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Hiragino Sans','Yu Gothic',sans-serif">
  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2d3d">
    RNN（直列）と Transformer（並列）の情報伝達の違い
  </text>

  <!-- ===== RNN panel ===== -->
  <text x="30" y="70" font-size="14" font-weight="bold" fill="#4a7fc9">RNN：バケツリレー式（直列）</text>

  <!-- 5 word nodes -->
  <g font-size="13" fill="#1f2d3d">
    <circle cx="60"  cy="110" r="22" fill="#eef4fb" stroke="#4a7fc9" stroke-width="2"/>
    <circle cx="185" cy="110" r="22" fill="#eef4fb" stroke="#4a7fc9" stroke-width="2"/>
    <circle cx="310" cy="110" r="22" fill="#eef4fb" stroke="#4a7fc9" stroke-width="2"/>
    <circle cx="435" cy="110" r="22" fill="#eef4fb" stroke="#4a7fc9" stroke-width="2"/>
    <circle cx="560" cy="110" r="22" fill="#fbe4e0" stroke="#c0392b" stroke-width="2"/>
    <text x="60"  y="115" text-anchor="middle">1</text>
    <text x="185" y="115" text-anchor="middle">2</text>
    <text x="310" y="115" text-anchor="middle">3</text>
    <text x="435" y="115" text-anchor="middle">4</text>
    <text x="560" y="115" text-anchor="middle">5</text>
  </g>

  <!-- sequential arrows with fading color to show info loss -->
  <line x1="82"  y1="110" x2="163" y2="110" stroke="#4a7fc9" stroke-width="4" opacity="0.9" marker-end="url(#a1)"/>
  <line x1="207" y1="110" x2="288" y2="110" stroke="#4a7fc9" stroke-width="4" opacity="0.65" marker-end="url(#a2)"/>
  <line x1="332" y1="110" x2="413" y2="110" stroke="#4a7fc9" stroke-width="4" opacity="0.4" marker-end="url(#a3)"/>
  <line x1="457" y1="110" x2="538" y2="110" stroke="#4a7fc9" stroke-width="4" opacity="0.2" marker-end="url(#a4)"/>

  <text x="310" y="160" text-anchor="middle" font-size="12" fill="#6b7684">
    隠れ状態を1つずつ伝言 → 遠くの単語ほど情報が薄れる
  </text>
  <text x="560" y="150" text-anchor="middle" font-size="11" fill="#c0392b">
    単語1の情報がほぼ届かない
  </text>

  <!-- ===== Transformer panel ===== -->
  <text x="30" y="230" font-size="14" font-weight="bold" fill="#d97a4a">Transformer：Attentionで全単語が直接つながる（並列）</text>

  <g font-size="13" fill="#1f2d3d">
    <circle cx="60"  cy="290" r="22" fill="#fdeee3" stroke="#d97a4a" stroke-width="2"/>
    <circle cx="185" cy="290" r="22" fill="#fdeee3" stroke="#d97a4a" stroke-width="2"/>
    <circle cx="310" cy="290" r="22" fill="#fdeee3" stroke="#d97a4a" stroke-width="2"/>
    <circle cx="435" cy="290" r="22" fill="#fdeee3" stroke="#d97a4a" stroke-width="2"/>
    <circle cx="560" cy="290" r="22" fill="#fbe4e0" stroke="#c0392b" stroke-width="2"/>
    <text x="60"  y="295" text-anchor="middle">1</text>
    <text x="185" y="295" text-anchor="middle">2</text>
    <text x="310" y="295" text-anchor="middle">3</text>
    <text x="435" y="295" text-anchor="middle">4</text>
    <text x="560" y="295" text-anchor="middle">5</text>
  </g>

  <!-- all-pairs connections (uniform strength, including distant 1-5) -->
  <g fill="none" stroke="#d97a4a" stroke-width="1.5" opacity="0.5">
    <line x1="60" y1="290" x2="185" y2="290"/>
    <line x1="60" y1="290" x2="310" y2="290"/>
    <line x1="60" y1="290" x2="435" y2="290"/>
    <line x1="185" y1="290" x2="310" y2="290"/>
    <line x1="185" y1="290" x2="435" y2="290"/>
    <line x1="185" y1="290" x2="560" y2="290"/>
    <line x1="310" y1="290" x2="435" y2="290"/>
    <line x1="310" y1="290" x2="560" y2="290"/>
    <line x1="435" y1="290" x2="560" y2="290"/>
  </g>
  <!-- highlighted direct 1-5 connection -->
  <path d="M 60,290 C 310,380 310,380 560,290" fill="none" stroke="#c0392b" stroke-width="3" opacity="0.9"/>

  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#6b7684">
    距離に関係なく、任意の2単語が直接つながる → 情報が薄れない
  </text>
  <text x="310" y="405" text-anchor="middle" font-size="11" fill="#c0392b">
    単語1と単語5も直接参照できる（赤線）
  </text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a7fc9" opacity="0.9"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a7fc9" opacity="0.65"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a7fc9" opacity="0.4"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a7fc9" opacity="0.2"/></marker>
  </defs>
</svg>
