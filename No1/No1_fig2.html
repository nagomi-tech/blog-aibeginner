  var groups = [
    { data: winterData, color: '#534AB7', label: '冬季' },
    { data: springData, color: '#1D9E75', label: '春・秋' },
    { data: summerData, color: '#D85A30', label: '夏季' }
  ];
  var allPoints = [];
  groups.forEach(function (g) {
    g.data.forEach(function (p) {
      allPoints.push({ x: p.x, y: p.y, d: p.d, color: g.color, label: g.label });
    });
  });

  // 2次曲線近似（元のChart.js版と同じ係数）
  function curveY(t) { return 8.3977 * t * t - 350.6598 * t + 6838.3749; }

  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');
  var tooltip = document.getElementById('tooltip');
  var wrap = document.querySelector('.chart-wrap');

  var W = 680, H = 380, PAD_L = 56, PAD_R = 16, PAD_T = 14, PAD_B = 40;
  var xMin = -3, xMax = 42, yMin = 2400, yMax = 5500;

  function resize() {
    // 内部解像度だけをdevicePixelRatio倍にする。表示サイズはCSSのwidth:100%に任せるため、
    // ここでstyle.width/heightを固定pxにしない（固定すると狭い画面でレスポンシブが効かなくなる）。
    var dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function toPx(x, y) {
    var px = PAD_L + (x - xMin) / (xMax - xMin) * (W - PAD_L - PAD_R);
    var py = H - PAD_B - (y - yMin) / (yMax - yMin) * (H - PAD_T - PAD_B);
    return [px, py];
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // グリッド
    ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
    ctx.fillStyle = '#aaa'; ctx.font = '11px sans-serif';
    for (var t = 0; t <= 40; t += 5) {
      var p1 = toPx(t, yMin), p2 = toPx(t, yMax);
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(t, p1[0], H - PAD_B + 16);
    }
    for (var v = 2500; v <= 5500; v += 500) {
      var q1 = toPx(xMin, v), q2 = toPx(xMax, v);
      ctx.beginPath(); ctx.moveTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(v, PAD_L - 8, q1[1] + 4);
    }

    // 軸タイトル
    ctx.fillStyle = '#888'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('日最高気温（℃）', W / 2, H - 6);
    ctx.save();
    ctx.translate(16, H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('最大電力消費量（万kW）', 0, 0);
    ctx.restore();

    // 2次曲線
    ctx.strokeStyle = '#BA7517'; ctx.lineWidth = 2.5; ctx.beginPath();
    var first = true;
    for (var tt = xMin; tt <= xMax; tt += 0.5) {
      var yy = curveY(tt);
      var p = toPx(tt, yy);
      if (first) { ctx.moveTo(p[0], p[1]); first = false; } else { ctx.lineTo(p[0], p[1]); }
    }
    ctx.stroke();

    // データ点
    allPoints.forEach(function (pt) {
      var p = toPx(pt.x, pt.y);
      pt._px = p[0]; pt._py = p[1];
      ctx.beginPath();
      ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
      ctx.fillStyle = pt.color.replace(')', ',0.6)').replace('rgb', 'rgba');
      // colorは#hexなので上の置換は効かない場合があるため直接rgba指定
      ctx.fillStyle = hexToRgba(pt.color, 0.6);
      ctx.fill();
    });
  }

  function hexToRgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // --- ツールチップ（マウス・タッチ共通：Pointer Events） ---
  function showTooltipAt(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var mx = clientX - rect.left, my = clientY - rect.top;
    var nearest = null, nearestDist = 14; // 判定半径(px)
    allPoints.forEach(function (pt) {
      var dx = pt._px - mx, dy = pt._py - my;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < nearestDist) { nearestDist = dist; nearest = pt; }
    });
    if (nearest) {
      tooltip.style.opacity = '1';
      tooltip.style.left = nearest._px + 'px';
      tooltip.style.top = nearest._py + 'px';
      tooltip.textContent = nearest.label + '：' + nearest.d + '　気温' + nearest.x + '℃　' + nearest.y + '万kW';
    } else {
      tooltip.style.opacity = '0';
    }
  }

  canvas.addEventListener('pointermove', function (e) {
    showTooltipAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerdown', function (e) {
    showTooltipAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerleave', function () {
    tooltip.style.opacity = '0';
  });

  window.addEventListener('resize', resize);
  resize();
})();
