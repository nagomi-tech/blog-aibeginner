<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">1単語ずつ当てさせながら学習する</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888">入力：「昨日は雨でした」／正解の出力：「It rained yesterday」</text>

  <!-- Step 1 -->
  <text x="20" y="85" font-size="12" font-weight="bold" fill="#0d3a75">Step 1</text>
  <rect x="80" y="68" width="150" height="34" rx="6" fill="#e6f0ff" stroke="#1a5fb4" stroke-width="1.2"/>
  <text x="155" y="90" text-anchor="middle" font-size="11" fill="#0d3a75">入力文（まだ出力なし）</text>
  <path d="M 235 85 L 290 85" stroke="#1a5fb4" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="295" y="68" width="110" height="34" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="350" y="90" text-anchor="middle" font-size="12" fill="#bf360c">予測：It</text>
  <path d="M 410 85 L 460 85" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#555">正解</text>
  <text x="480" y="94" text-anchor="middle" font-size="12" fill="#1b5e20">It ✓</text>

  <!-- Step 2 -->
  <text x="20" y="155" font-size="12" font-weight="bold" fill="#0d3a75">Step 2</text>
  <rect x="80" y="138" width="150" height="34" rx="6" fill="#e6f0ff" stroke="#1a5fb4" stroke-width="1.2"/>
  <text x="155" y="156" text-anchor="middle" font-size="10.5" fill="#0d3a75">入力文＋出力途中</text>
  <text x="155" y="168" text-anchor="middle" font-size="10.5" fill="#0d3a75">（It）</text>
  <path d="M 235 155 L 290 155" stroke="#1a5fb4" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="295" y="138" width="130" height="34" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#bf360c">予測：rained</text>
  <path d="M 430 155 L 480 155" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="500" y="150" text-anchor="middle" font-size="11" fill="#555">正解</text>
  <text x="500" y="164" text-anchor="middle" font-size="12" fill="#1b5e20">rained ✓</text>

  <!-- Step 3 -->
  <text x="20" y="225" font-size="12" font-weight="bold" fill="#0d3a75">Step 3</text>
  <rect x="80" y="208" width="150" height="34" rx="6" fill="#e6f0ff" stroke="#1a5fb4" stroke-width="1.2"/>
  <text x="155" y="226" text-anchor="middle" font-size="10.5" fill="#0d3a75">入力文＋出力途中</text>
  <text x="155" y="238" text-anchor="middle" font-size="10.5" fill="#0d3a75">（It rained）</text>
  <path d="M 235 225 L 290 225" stroke="#1a5fb4" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <rect x="295" y="208" width="140" height="34" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.2"/>
  <text x="365" y="230" text-anchor="middle" font-size="12" fill="#bf360c">予測：yesterday</text>
  <path d="M 440 225 L 490 225" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <text x="515" y="220" text-anchor="middle" font-size="11" fill="#555">正解</text>
  <text x="515" y="234" text-anchor="middle" font-size="12" fill="#1b5e20">yesterday ✓</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a5fb4"/>
    </marker>
  </defs>

  <line x1="40" y1="270" x2="640" y2="270" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#555">「これまでの正解」を教えながら「次の1つ」だけを当てさせる、を繰り返す</text>
  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#555">出力文の最後の単語まで、このステップが続く</text>
</svg>
