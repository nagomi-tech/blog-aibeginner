<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- 背景 -->
  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>

  <!-- 上段ラベル -->
  <text x="350" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">拡散過程（ノイズを少しずつ加える）</text>

  <!-- 上段：画像→ノイズ の5コマ -->
  <!-- コマ1：きれいな画像（円と三角で簡易的に表現） -->
  <g>
    <rect x="30" y="55" width="90" height="90" rx="6" fill="#eaf2fb" stroke="#8fb8e0" stroke-width="1.5"/>
    <circle cx="60" cy="90" r="14" fill="#4a90d9"/>
    <polygon points="90,130 110,130 100,105" fill="#4a90d9"/>
  </g>
  <!-- 矢印1 -->
  <path d="M125 100 L155 100" stroke="#999999" stroke-width="2.5" marker-end="url(#arrow1)"/>

  <!-- コマ2：軽いノイズ -->
  <g>
    <rect x="160" y="55" width="90" height="90" rx="6" fill="#eaf2fb" stroke="#8fb8e0" stroke-width="1.5"/>
    <circle cx="190" cy="90" r="14" fill="#5f9bd6" opacity="0.75"/>
    <polygon points="220,130 240,130 230,105" fill="#5f9bd6" opacity="0.75"/>
    <g opacity="0.35">
      <circle cx="175" cy="70" r="1.6" fill="#666"/>
      <circle cx="235" cy="65" r="1.6" fill="#666"/>
      <circle cx="200" cy="120" r="1.6" fill="#666"/>
      <circle cx="245" cy="110" r="1.6" fill="#666"/>
      <circle cx="180" cy="130" r="1.6" fill="#666"/>
    </g>
  </g>
  <path d="M255 100 L285 100" stroke="#999999" stroke-width="2.5" marker-end="url(#arrow1)"/>

  <!-- コマ3：中程度ノイズ -->
  <g>
    <rect x="290" y="55" width="90" height="90" rx="6" fill="#eef1f4" stroke="#b7bfc7" stroke-width="1.5"/>
    <circle cx="320" cy="90" r="14" fill="#8fa6bd" opacity="0.4"/>
    <polygon points="350,130 370,130 360,105" fill="#8fa6bd" opacity="0.4"/>
    <g opacity="0.55">
      <circle cx="300" cy="65" r="1.6" fill="#666"/>
      <circle cx="365" cy="70" r="1.6" fill="#666"/>
      <circle cx="335" cy="118" r="1.6" fill="#666"/>
      <circle cx="375" cy="105" r="1.6" fill="#666"/>
      <circle cx="305" cy="130" r="1.6" fill="#666"/>
      <circle cx="345" cy="60" r="1.6" fill="#666"/>
      <circle cx="310" cy="105" r="1.6" fill="#666"/>
    </g>
  </g>
  <path d="M385 100 L415 100" stroke="#999999" stroke-width="2.5" marker-end="url(#arrow1)"/>

  <!-- コマ4：強いノイズ -->
  <g>
    <rect x="420" y="55" width="90" height="90" rx="6" fill="#f1f1f1" stroke="#c9c9c9" stroke-width="1.5"/>
    <circle cx="450" cy="90" r="14" fill="#b3b3b3" opacity="0.2"/>
    <g opacity="0.75">
      <circle cx="430" cy="65" r="1.6" fill="#555"/>
      <circle cx="495" cy="70" r="1.6" fill="#555"/>
      <circle cx="465" cy="118" r="1.6" fill="#555"/>
      <circle cx="505" cy="105" r="1.6" fill="#555"/>
      <circle cx="435" cy="130" r="1.6" fill="#555"/>
      <circle cx="475" cy="60" r="1.6" fill="#555"/>
      <circle cx="440" cy="105" r="1.6" fill="#555"/>
      <circle cx="490" cy="130" r="1.6" fill="#555"/>
      <circle cx="460" cy="75" r="1.6" fill="#555"/>
    </g>
  </g>
  <path d="M515 100 L545 100" stroke="#999999" stroke-width="2.5" marker-end="url(#arrow1)"/>

  <!-- コマ5：完全なノイズ -->
  <g>
    <rect x="550" y="55" width="90" height="90" rx="6" fill="#e9e9e9" stroke="#c9c9c9" stroke-width="1.5"/>
    <g opacity="0.85">
      <circle cx="565" cy="70" r="1.6" fill="#555"/>
      <circle cx="600" cy="65" r="1.6" fill="#555"/>
      <circle cx="580" cy="90" r="1.6" fill="#555"/>
      <circle cx="620" cy="80" r="1.6" fill="#555"/>
      <circle cx="565" cy="110" r="1.6" fill="#555"/>
      <circle cx="605" cy="120" r="1.6" fill="#555"/>
      <circle cx="590" cy="130" r="1.6" fill="#555"/>
      <circle cx="625" cy="130" r="1.6" fill="#555"/>
      <circle cx="570" cy="130" r="1.6" fill="#555"/>
      <circle cx="615" cy="60" r="1.6" fill="#555"/>
      <circle cx="595" cy="105" r="1.6" fill="#555"/>
      <circle cx="575" cy="60" r="1.6" fill="#555"/>
    </g>
  </g>

  <text x="75" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">きれいな画像</text>
  <text x="595" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">完全なノイズ</text>

  <!-- 下段：逆向き矢印とラベル -->
  <path d="M610 200 L100 200" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <rect x="230" y="212" width="240" height="26" rx="4" fill="#ffffff" stroke="#4a90d9" stroke-width="1"/>
  <text x="350" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2b6cb0" font-weight="bold">この逆をたどる＝AIによる画像生成</text>

  <text x="350" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777777">ノイズから少しずつ「取り除く」ことを繰り返すと、1枚の画像が浮かび上がる</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999999"/>
    </marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a90d9"/>
    </marker>
  </defs>
</svg>
