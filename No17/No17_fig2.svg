<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" width="100%">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">ノイズ除去処理の1サイクル</text>

  <!-- テキスト条件の小さな流れ -->
  <rect x="30" y="45" width="150" height="52" rx="6" fill="#fdf3e3" stroke="#e0b96a" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a4a2a">テキストの指示</text>
  <text x="105" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a6a4a">（例：白い猫が</text>
  <text x="105" y="92" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a6a4a">窓辺で眠っている）</text>

  <path d="M180 71 L198 71" stroke="#999999" stroke-width="2.2" marker-end="url(#arrowM)"/>

  <rect x="200" y="45" width="170" height="52" rx="6" fill="#fdf3e3" stroke="#e0b96a" stroke-width="1.5"/>
  <text x="285" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5a4a2a">ベクトルに変換</text>
  <text x="285" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a6a4a">（条件として使う）</text>

  <path d="M285 97 L285 138" stroke="#999999" stroke-width="2.2" marker-end="url(#arrowM)"/>
  <text x="300" y="122" font-family="sans-serif" font-size="10" fill="#8a7a4a">条件</text>

  <!-- メインのノイズ除去ループ -->
  <rect x="20" y="140" width="140" height="90" rx="6" fill="#eef1f4" stroke="#b7bfc7" stroke-width="1.5"/>
  <text x="90" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">ノイズを含む</text>
  <text x="90" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">潜在表現</text>

  <path d="M160 185 L198 185" stroke="#999999" stroke-width="2.5" marker-end="url(#arrowM)"/>

  <rect x="200" y="140" width="170" height="90" rx="6" fill="#eaf2fb" stroke="#8fb8e0" stroke-width="1.5"/>
  <text x="285" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b6cb0" font-weight="bold">ノイズ除去</text>
  <text x="285" y="193" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b6cb0" font-weight="bold">ネットワーク</text>
  <text x="285" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a80b0">（Attentionを含む）</text>

  <path d="M370 185 L408 185" stroke="#999999" stroke-width="2.5" marker-end="url(#arrowM)"/>

  <rect x="410" y="140" width="140" height="90" rx="6" fill="#eef1f4" stroke="#b7bfc7" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">予測された</text>
  <text x="480" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">ノイズ</text>

  <path d="M550 185 L588 185" stroke="#999999" stroke-width="2.5" marker-end="url(#arrowM)"/>

  <rect x="590" y="140" width="170" height="90" rx="6" fill="#eef1f4" stroke="#b7bfc7" stroke-width="1.5"/>
  <text x="675" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">差し引いて</text>
  <text x="675" y="193" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444444">ノイズを減らす</text>

  <!-- ループの矢印（主要ループの下側を通す） -->
  <path d="M600 230 L600 250 L90 250 L90 230" stroke="#999999" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowM)"/>
  <rect x="255" y="238" width="180" height="24" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="345" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">この工程を繰り返す（× N）</text>

  <!-- ループを抜けて画像へ -->
  <path d="M675 230 L675 268" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrowB)"/>
  <text x="712" y="252" font-family="sans-serif" font-size="10" fill="#4a80b0">十分に減ったら</text>

  <rect x="575" y="270" width="200" height="80" rx="6" fill="#eaf2fb" stroke="#8fb8e0" stroke-width="1.5"/>
  <text x="675" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2b6cb0" font-weight="bold">画像化</text>
  <text x="675" y="316" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a80b0">（潜在空間から</text>
  <text x="675" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a80b0">元のサイズの画像へ）</text>

  <path d="M675 350 L675 388" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#arrowB)"/>

  <rect x="605" y="390" width="140" height="55" rx="6" fill="#4a90d9"/>
  <text x="675" y="423" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold">完成画像</text>

  <text x="400" y="445" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999999">灰色の矢印：ノイズ除去の繰り返し処理　　青色の矢印：ループを抜けたあとの流れ</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999999"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a90d9"/>
    </marker>
  </defs>
</svg>